<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Brewing 101 Guide</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        /* Container utama navigasi */
        .nav-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        /* Styling dasar link */
        .nav-link {
            flex: 1;
            text-decoration: none;
            color: inherit;
        }

        /* Styling kotak navigasi */
        .nav-box {
            background-color: rgb(185, 230, 255);
            height: 150px; /* Tinggi kotak seragam */
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            transition: all 0.3s ease;
            border: 2px solid rgba(0,0,0,0.05);
            text-align: center;
            padding: 20px;
        }

        /* Efek hover */
        .nav-link:hover .nav-box {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
            background-color: rgb(160, 220, 255);
            border-color: #5dade2;
        }

        .nav-box h2 {
            margin: 0;
            font-size: 1.3rem;
            color: #2c3e50;
        }

        /* Responsif untuk layar HP */
        @media (max-width: 700px) {
            .nav-container {
                flex-direction: column;
            }
            .nav-box {
                height: 100px;
            }
        }
    </style>
</head>
<body>

    <h1>Minecraft Brewing 101 Guide</h1>

    <div class="nav-container">
        
        <a href="alatbahan.html" class="nav-link">
            <div class="nav-box">
                <h2>Alat dan Bahan</h2>
            </div>
        </a>

        <a href="reseppotion.html" class="nav-link">
            <div class="nav-box">
                <h2>Resep Ramuan</h2>
            </div>
        </a>

        <a href="efek.html" class="nav-link">
            <div class="nav-box">
                <h2>Efek Potion</h2>
            </div>
        </a>

    </div>

</body>
</html>
